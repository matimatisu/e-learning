{% extends 'base.html' %}

{% block title %}
    {{ slide.title }}
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h2 class="mb-4">

            {{ slide.title }}

        </h2>

        <p class="fs-5">

            {{ slide.content }}

        </p>

    </div>

</div>

<div class="d-flex justify-content-between mt-4">

    <div>

        {% if previous_slide %}

            <a
                class="btn btn-secondary"
                href="/learning/slide/{{ previous_slide.id }}/">

                ◀ 前へ

            </a>

        {% endif %}

    </div>

    <div>

        Slide {{ slide.order }}

    </div>

    <div>

        {% if next_slide %}

            <a
                class="btn btn-primary"
                href="/learning/slide/{{ next_slide.id }}/">

                次へ ▶

            </a>

        {% endif %}

    </div>

</div>

<div class="text-center mt-5">

    <a
        class="btn btn-success btn-lg"
        href="/learning/quiz/{{ slide.lesson.id }}/">

        小テストへ

    </a>

</div>

{% endblock %}
